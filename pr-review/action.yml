name: 'Claude PR Review'
description: 'Uses Claude to review a pull request for code quality, security, performance, and test coverage'

inputs:
  app_id:
    description: 'GitHub App ID for generating a short-lived token (required for App-identity comments)'
    required: false
  app_private_key:
    description: 'GitHub App private key for generating a short-lived token (required for App-identity comments)'
    required: false
  spike_diagnostics:
    description: 'Spike #261: enable empirical diagnostics for overlay reachability. Production callers MUST leave unset.'
    required: false
    default: 'false'
  authorized_users:
    description: 'Comma-separated list of GitHub usernames that bypass the association check. When set, any actor in this list is authorized regardless of org membership visibility. Takes precedence over the API-fallback collaborator check. See #253.'
    required: false
    default: ''
  claude_code_oauth_token:
    description: 'Claude Code OAuth token'
    required: true
  model:
    description: 'Claude model to use'
    required: false
    default: 'claude-sonnet-4-5'
  max_turns:
    description: 'Maximum number of Claude turns'
    required: false
    default: '30'

runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Resolve diff base
      if: github.event.action == 'synchronize'
      id: resolve-diff-base
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        DIFF_FALLBACK_SHA: ${{ github.event.before }}
      run: |
        # Walk PR commits newest-first (excluding HEAD, which hasn't been reviewed yet)
        # and find the most recent commit carrying a claude-pr-review:success status.
        # Export DIFF_BASE_SHA for use by the "Set diff scope" step.
        REPO="$GH_REPOSITORY"
        PR_NUMBER="$PR_NUMBER"
        FALLBACK="$DIFF_FALLBACK_SHA"

        # Fetch the list of PR commit SHAs, oldest-first (GitHub API default), then reverse.
        COMMITS=$(gh api "repos/$REPO/pulls/$PR_NUMBER/commits" \
          --jq '[.[].sha] | reverse | .[]' 2>/dev/null || true)

        if [ -z "$COMMITS" ]; then
          echo "Warning: Could not fetch PR commits list — will fall back to github.event.before"
        fi

        CHECKPOINT=""
        # Skip the first entry — that is HEAD (the current push), not yet reviewed.
        FIRST=true
        while IFS= read -r sha; do
          if [ "$FIRST" = "true" ]; then
            FIRST=false
            continue
          fi
          # Count statuses on this commit that match context=claude-pr-review and state=success.
          COUNT=$(gh api "repos/$REPO/commits/$sha/statuses" \
            --jq '[.[] | select(.context == "claude-pr-review" and .state == "success")] | length' \
            2>/dev/null || echo "0")
          if [ "$COUNT" -gt "0" ]; then
            CHECKPOINT="$sha"
            break
          fi
        done <<< "$COMMITS"

        if [ -n "$CHECKPOINT" ]; then
          echo "Found review checkpoint: $CHECKPOINT — using as diff base"
          echo "DIFF_BASE_SHA=$CHECKPOINT" >> "$GITHUB_ENV"
        elif [ -n "$FALLBACK" ] && [ "$FALLBACK" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$FALLBACK" 2>/dev/null; then
          echo "No checkpoint found — falling back to github.event.before ($FALLBACK)"
          echo "DIFF_BASE_SHA=$FALLBACK" >> "$GITHUB_ENV"
        else
          echo "No checkpoint and github.event.before is invalid or zero SHA — using full PR diff"
          echo "DIFF_BASE_SHA=" >> "$GITHUB_ENV"
        fi

    - name: Set diff scope
      shell: bash
      # shellcheck disable=SC2016
      env:
        AFTER_SHA: ${{ github.event.after }}
        EVENT_ACTION: ${{ github.event.action }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        if [ "$EVENT_ACTION" = "synchronize" ] && [ -n "$DIFF_BASE_SHA" ]; then
          # DIFF_BASE_SHA is set by the "Resolve diff base" step above.
          # We interpolate it here via shell variable expansion (not expression syntax) so
          # the value the Claude prompt sees is the checkpoint SHA, not the literal expression.
          # Use the heredoc delimiter format required by GitHub for multiline env values —
          # plain KEY=VALUE is rejected when the value contains embedded newlines.
          {
            printf 'DIFF_INSTRUCTION<<EOF\n'
            printf 'This is a synchronize event (new commits were pushed to the PR). Start by running `git diff %s %s` to see only the changes in this push.\n\nAfter inspecting the diff, use your judgment: if the changes touch foundational or widely-shared code — such as base classes, abstract classes, interfaces, shared utilities, type definitions, schemas, authentication/authorization logic, or configuration files that many other files depend on — then also run `gh pr diff %s` to get the full PR context before completing your review.\n\nIf the changes are isolated (self-contained features, local logic, tests, docs), review only the incremental changes and do not re-review files already covered in previous commits.\n' \
              "$DIFF_BASE_SHA" "$AFTER_SHA" "$PR_NUMBER"
            printf 'EOF\n'
          } >> "$GITHUB_ENV"
        else
          # Single-line value — plain KEY=VALUE format is valid here (no embedded newlines)
          printf 'DIFF_INSTRUCTION=Use `gh pr diff %s` to retrieve the full PR diff.\n' \
            "$PR_NUMBER" >> "$GITHUB_ENV"
        fi

    - name: Compute effective max_turns
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CALLER_MAX_INPUT: ${{ inputs.max_turns }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        CALLER_MAX="$CALLER_MAX_INPUT"
        # Default to 0 if empty or non-numeric (defense-in-depth; action default is '30')
        if ! [[ "$CALLER_MAX" =~ ^[0-9]+$ ]]; then
          CALLER_MAX=0
        fi
        FILES=$(gh pr view "$PR_NUMBER" --json files --jq '.files | length' 2>/dev/null || echo "0")
        if ! [[ "$FILES" =~ ^[0-9]+$ ]]; then
          FILES=0
        fi
        # Scale max_turns by PR size:
        #   small  (≤10 files) → 30 turns
        #   medium (11-30)     → 45 turns
        #   large  (>30)       → 60 turns
        if [ "$FILES" -gt 30 ]; then
          DYNAMIC=60
        elif [ "$FILES" -gt 10 ]; then
          DYNAMIC=45
        else
          DYNAMIC=30
        fi
        if [ "$CALLER_MAX" -gt "$DYNAMIC" ]; then
          EFFECTIVE_MAX="$CALLER_MAX"
        else
          EFFECTIVE_MAX="$DYNAMIC"
        fi
        echo "EFFECTIVE_MAX_TURNS=$EFFECTIVE_MAX" >> "$GITHUB_ENV"
        echo "PR_FILES=$FILES" >> "$GITHUB_ENV"

    - name: Check author association
      # Three-step authorization (fix for #253 — private org membership is not
      # disclosed in pull_request* event payloads, so org admins may appear as
      # CONTRIBUTOR even though they are repo collaborators):
      #
      # 1. authorized_users CSV input (explicit override, highest precedence).
      #    If $ACTOR is in the list, authorize immediately — no API call needed.
      #
      # 2. author_association field from the event payload.
      #    OWNER / MEMBER / COLLABORATOR → authorize.
      #    This fast-path is still valid for public org membership and direct
      #    collaborators whose association GitHub does disclose.
      #
      # 3. API-fallback collaborator check (zero-config fix for #253).
      #    gh api repos/$REPO/collaborators/$ACTOR exits 0 (HTTP 204) when the
      #    actor is a repo collaborator; non-zero (HTTP 404/403) when not.
      #    Failure mode: any non-zero exit (rate-limit, 403, network error) is
      #    treated as "not a collaborator" and the PR is blocked — we do NOT
      #    silently authorize on API error.
      #
      # This step emits skip=true only when all three checks fail, which
      # preserves the existing downstream guard used by: Check PR size,
      # claude-code-action, quality-gate, and shadow-gate steps.
      id: authz
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        PR_ACTOR: ${{ github.event.pull_request.user.login }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GH_REPO: ${{ github.repository }}
        AUTHORIZED_USERS: ${{ inputs.authorized_users }}
      run: |
        ASSOCIATION="$AUTHOR_ASSOCIATION"
        ACTOR="$PR_ACTOR"
        REPO="$GH_REPO"

        # Step 1 — explicit authorized_users allowlist (case-insensitive CSV match).
        # Whitespace is stripped before matching so "alice, bob, charlie" works
        # the same as "alice,bob,charlie" — copy-paste from human-written lists
        # is the common case and an unstripped " bob " would silently fail to
        # match "bob".
        if [ -n "$AUTHORIZED_USERS" ]; then
          ACTOR_LOWER=$(echo "$ACTOR" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          USERS_LOWER=$(echo "$AUTHORIZED_USERS" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          if echo ",$USERS_LOWER," | grep -q ",$ACTOR_LOWER,"; then
            echo "Authorized via authorized_users allowlist: $ACTOR"
            exit 0
          fi
        fi

        # Step 2 — author_association field from event payload.
        if [ "$ASSOCIATION" = "OWNER" ] || [ "$ASSOCIATION" = "MEMBER" ] || [ "$ASSOCIATION" = "COLLABORATOR" ]; then
          echo "Authorized via author_association: $ACTOR ($ASSOCIATION)"
          exit 0
        fi

        # Step 3 — API-fallback collaborator check (#253).
        # Handles private org membership: GitHub omits private-org MEMBER status
        # from pull_request* payloads, so admins may appear as CONTRIBUTOR.
        # gh api exits 0 on HTTP 204 (is a collaborator) or non-zero on 404/403.
        # Any non-zero exit — including rate-limit (429) or server errors — is
        # intentionally treated as "not a collaborator" to avoid silent authorization.
        echo "author_association is '$ASSOCIATION' — attempting API collaborator check for $ACTOR"
        if gh api -X GET "repos/$REPO/collaborators/$ACTOR" --silent 2>/dev/null; then
          echo "Authorized via API collaborator check: $ACTOR is a repo collaborator"
          exit 0
        fi

        # All three checks failed — block the review.
        echo "Not authorized: $ACTOR (association=$ASSOCIATION, not in authorized_users, not a repo collaborator)"
        gh pr comment "$PR_NUMBER" --body "Automated review is restricted to repository members. A maintainer can trigger a review by commenting \`@claude review this PR\`."
        echo "skip=true" >> "$GITHUB_OUTPUT"

    - name: Check PR size
      id: size-check
      if: steps.authz.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        FILES=$(gh pr view "$PR_NUMBER" --json files --jq '.files | length' 2>/dev/null || echo "0")
        ADDITIONS=$(gh pr view "$PR_NUMBER" --json additions --jq '.additions' 2>/dev/null || echo "0")
        DELETIONS=$(gh pr view "$PR_NUMBER" --json deletions --jq '.deletions' 2>/dev/null || echo "0")
        LINES=$(( ADDITIONS + DELETIONS ))
        if [ "$FILES" -gt 50 ] || [ "$LINES" -gt 5000 ]; then
          gh pr comment "$PR_NUMBER" --body "This PR is too large for automated review ($FILES files, $LINES lines changed). Consider breaking it into smaller, focused PRs."
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "PR size OK: $FILES files, $LINES lines"
        fi

    - name: Record review start time
      shell: bash
      run: echo "REVIEW_START_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

    - name: 'Spike #261: pre-cp diagnostics'
      if: inputs.spike_diagnostics == 'true'
      shell: bash
      run: |
        echo "===SPIKE-261 PRE-CP==="
        echo "--- \$HOME/.claude/ state before cp ---"
        ls -laR "$HOME/.claude/" 2>&1 | head -200 || echo "(directory does not exist)"
        echo "--- /opt/claude/.claude dir tree (maxdepth 3) ---"
        find /opt/claude/.claude -maxdepth 3 -type d 2>&1 | head -50 || echo "(not found)"
        echo "===SPIKE-261 PRE-CP END==="

    - name: Install overlay tree for claude-code-action CLI
      shell: bash
      # shellcheck disable=SC2016
      env:
        SPIKE_DIAG: ${{ inputs.spike_diagnostics }}
      run: |
        # GitHub Actions overrides HOME=/github/home in container jobs, discarding
        # the image's baked HOME=/opt/claude. The CLI discovers $HOME/.claude/ which
        # resolves to /github/home/.claude/ (empty) — agents/skills/plugins/hooks are
        # all orphaned. Fix: copy the full baked overlay tree into $HOME/.claude/ so
        # the CLI's user-level discovery finds the complete agent/skill/plugin set.
        # CLAUDE.md copy is covered by this cp (superset of the old cp step).
        # Tracking: https://github.com/glitchwerks/github-actions/issues/259
        if [ -d /opt/claude/.claude ]; then
          mkdir -p "$HOME/.claude"
          if [ "$SPIKE_DIAG" = "true" ]; then
            echo "===SPIKE-261 CP==="
            echo "Running: cp -a /opt/claude/.claude/. \$HOME/.claude/"
          fi
          cp -a /opt/claude/.claude/. "$HOME/.claude/"
          agent_count=$(find "$HOME/.claude/agents" -name '*.md' 2>/dev/null | wc -l || echo 0)
          skill_count=$(find "$HOME/.claude/skills" -type f 2>/dev/null | wc -l || echo 0)
          plugin_count=$(find "$HOME/.claude/plugins" -type d -mindepth 1 -maxdepth 1 2>/dev/null | wc -l || echo 0)
          echo "Overlay installed: agents=${agent_count} skills=${skill_count} plugins=${plugin_count}"
          if [ "$SPIKE_DIAG" = "true" ]; then
            echo "===SPIKE-261 CP END==="
          fi
        else
          echo "::warning::No baked overlay at /opt/claude/.claude — running without overlay tree"
        fi

    - name: 'Spike #261: post-cp diagnostics'
      if: inputs.spike_diagnostics == 'true'
      shell: bash
      run: |
        echo "===SPIKE-261 POST-CP==="
        echo "--- \$HOME/.claude/ state after cp ---"
        ls -laR "$HOME/.claude/" 2>&1 | head -200 || echo "(directory does not exist)"
        echo "--- agents/ and skills/ dir counts ---"
        find "$HOME/.claude/agents" "$HOME/.claude/skills" -maxdepth 2 -type d 2>/dev/null | wc -l || echo "0"
        echo "===SPIKE-261 POST-CP END==="

    - name: Generate App token
      id: app-token
      if: inputs.app_id != '' && inputs.app_private_key != ''
      uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3  # v3.1.1
      with:
        client-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.app_private_key }}

    - name: Resolve review token
      id: token
      shell: bash
      # shellcheck disable=SC2016
      env:
        APP_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        if [ -n "$APP_TOKEN" ]; then
          echo "::debug::Using GitHub App token for review identity"
          echo "value=$APP_TOKEN" >> "$GITHUB_OUTPUT"
        else
          echo "::error::No authentication token provided. Set app_id + app_private_key inputs. See README for GitHub App setup instructions."
          exit 1
        fi

    - name: 'Spike #261: build prompt suffix'
      if: inputs.spike_diagnostics == 'true'
      shell: bash
      run: |
        # Write the spike prompt suffix to GITHUB_ENV so it is available
        # to the claude-code-action prompt: block below.
        {
          printf 'SPIKE_261_PROMPT_SUFFIX<<EOF\n'
          printf '\n<!-- SPIKE-261 -->\n'
          printf 'After your primary review, attempt to dispatch the `inquisitor` agent via the `Task` tool to deliver an adversarial second pass on this PR. Report the inquisitor'"'"'s findings in a separate section titled "## Inquisitor Second Pass". If the `Task` tool is unavailable or not recognized, state that explicitly (e.g. "Task tool not available") so we can confirm whether claude-code-action@v1 recognizes Task/Skill as allowedTools tokens.\n'
          printf 'EOF\n'
        } >> "$GITHUB_ENV"

    - uses: anthropics/claude-code-action@v1
      id: claude-review
      if: steps.authz.outputs.skip != 'true' && steps.size-check.outputs.skip != 'true'
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        github_token: ${{ steps.token.outputs.value }}
        use_sticky_comment: true
        track_progress: true
        claude_args: --max-turns ${{ env.EFFECTIVE_MAX_TURNS }} --model ${{ inputs.model }} --allowedTools "Bash(gh pr diff:*),Bash(gh pr review:*),Bash(gh pr view:*),Task,Skill,Read,Grep,Glob"
        prompt: |
          Review the pull request in repository ${{ github.repository }} (#${{ github.event.pull_request.number }}).

          ${{ env.DIFF_INSTRUCTION }}

          Evaluate the changes across these dimensions:

          1. **Code quality** — clarity, naming, structure, duplication, and adherence to the language's idiomatic style
          2. **Security** — injection risks, secrets in code, insecure dependencies, unsafe deserialization, improper auth checks
          3. **Performance** — unnecessary allocations, N+1 queries, blocking calls, inefficient algorithms
          4. **Test coverage** — are new code paths tested? are edge cases and error paths covered?
          5. **Documentation** — are public APIs, functions, and non-obvious logic commented or documented?

          Post a summary comment on the PR. Where a specific line is problematic, post an inline review comment on that line using `gh pr review`. Be constructive and specific — cite the line and explain the concern and a suggested fix.${{ env.SPIKE_261_PROMPT_SUFFIX }}

    - name: 'Spike #261: post-action diagnostics'
      if: always() && inputs.spike_diagnostics == 'true'
      shell: bash
      run: |
        echo "===SPIKE-261 POST-ACTION==="
        echo "--- \$HOME/.claude/ state after claude-code-action ---"
        ls -laR "$HOME/.claude/" 2>&1 | head -200 || echo "(directory does not exist)"
        echo "--- Files added/changed since post-cp (checking mtime within last 10 min) ---"
        find "$HOME/.claude" -newer /tmp -type f 2>/dev/null | head -50 || echo "(none or /tmp not available as reference)"
        echo "===SPIKE-261 POST-ACTION END==="

    - name: Record review checkpoint
      if: github.event.action == 'synchronize' && steps.claude-review.outcome == 'success'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPOSITORY: ${{ github.repository }}
        AFTER_SHA: ${{ github.event.after }}
      run: |
        # Post a commit status to the HEAD of this push so the next synchronize run
        # can find the last successfully reviewed SHA and use it as its diff base.
        gh api "repos/$GH_REPOSITORY/statuses/$AFTER_SHA" \
          -f state=success \
          -f context=claude-pr-review \
          -f description="Review complete"
        echo "Checkpoint recorded: $AFTER_SHA"

    - name: Quality gate — post claude-pr-review/quality-gate status
      if: steps.authz.outputs.skip != 'true' && steps.size-check.outputs.skip != 'true' && steps.claude-review.outcome == 'success'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        # `github.event.pull_request.head.sha` is the right SHA for the status check.
        # We post against HEAD because consumers' branch protection rules evaluate
        # status checks per the HEAD commit of the PR's head branch.
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        SEVERITY_REGEX_SH: ${{ github.action_path }}/lib/severity-regex.sh
        REVIEW_START_TIME: ${{ env.REVIEW_START_TIME }}
      run: |
        set -euo pipefail
        REPO="$GH_REPOSITORY"
        PR_NUMBER="$PR_NUMBER"
        # shellcheck source=lib/severity-regex.sh
        # shellcheck disable=SC1090
        source "$SEVERITY_REGEX_SH"

        # Fetch the most recent comment authored by any [bot] account *that was
        # updated during this review run*. The endswith("[bot]") matcher picks
        # up Claude's App-identity comment regardless of bot login (#250 made
        # the matcher login-agnostic), but it would also pick up stale comments
        # from other bots (Dependabot, Renovate, CodeQL, etc.) — so we MUST
        # gate by REVIEW_START_TIME, otherwise a foreign bot updating its own
        # comment after Claude finishes would silently win the sort and the
        # gate would read the wrong body. Mirrors the synthesis step at
        # ~line 370 and the incomplete-review check at ~line 589.
        #
        # IMPORTANT (#184 fix): the GitHub REST API's /issues/{n}/comments
        # endpoint does NOT support sort/direction query params — those are
        # silently ignored and results come back in created_at ASC order.
        # We must sort manually in jq. Using sort_by(.updated_at) | last
        # picks the most-recently-edited matching bot comment regardless of
        # API default ordering. Pagination: 100 comments is enough for any
        # realistic PR; if a PR ever exceeds, the gate misses newer pages.
        BODY=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
          --jq "map(select((.user.login | endswith(\"[bot]\")) and .updated_at >= \"$REVIEW_START_TIME\")) | sort_by(.updated_at) | last | .body // \"\"" \
          2>/dev/null || echo "")

        # If no bot comment exists, the review has not completed — skip the status
        # post rather than silently posting success (fail-open) or failure (punitive).
        # Branch protection will see no status and treat it as a missing required
        # check, which correctly blocks merge until the review actually runs.
        if [ -z "$BODY" ]; then
          echo "Quality gate: no [bot] sticky comment found — skipping status post"
          exit 0
        fi

        # Severity-marker grep (post-review-feedback hardening, PR #179 review):
        # - Emoji-prefixed forms are unique to bot output and specific enough as-is.
        # - Plain "MAJOR" / "BLOCKING" require markdown bold to avoid matching code
        #   snippets, prose, or unrelated tokens (SUBMAJOR, MAJOR_VERSION, UNBLOCKING).
        # Regex sourced from lib/severity-regex.sh (shared with synthesis and shadow gate).
        # Pre-filter: drop resolution-narration lines before the severity grep.
        # On incremental (multi-pass) reviews the persona may narrate resolved
        # findings in two styles: (a) `#### ✅ 🔴 Critical (BLOCKING) - FIXED`
        # (checkmark on same line — covered by ✅ filter, issue #248); or
        # (b) a `### ✅` section header followed by per-finding lines ending in
        # `— **FIXED**`/`**ADDRESSED**`/`**RESOLVED**` (bold markdown suffix —
        # covered by the extended regex, issue #257). The pattern is anchored to
        # end-of-line (\s*$) so it only matches the persona's actual terminal suffix
        # and does not false-positive-suppress findings that mention FIXED mid-line.
        # Without this pre-filter, the gate blocks PRs whose findings are all fixed.
        BLOCKER_HITS=$(printf '%s' "$BODY" | grep -vE '✅|\*\*(FIXED|ADDRESSED|RESOLVED)\*\*\s*$' | grep -E -c "$SEVERITY_BLOCKER_RE" || true)

        echo "Quality gate scan: $BLOCKER_HITS marker(s) matched in latest sticky comment"

        if [ "$BLOCKER_HITS" -gt "0" ]; then
          STATE="failure"
          DESCRIPTION="$BLOCKER_HITS severity marker(s) matched — see review comment"
        else
          STATE="success"
          DESCRIPTION="No Critical or High-Priority findings"
        fi

        gh api "repos/$REPO/statuses/$HEAD_SHA" \
          -f state="$STATE" \
          -f context="claude-pr-review/quality-gate" \
          -f description="$DESCRIPTION"
        echo "Posted status: context=claude-pr-review/quality-gate state=$STATE"

    - name: Synthesize structured marker via post-processing
      if: steps.authz.outputs.skip != 'true' && steps.size-check.outputs.skip != 'true' && steps.claude-review.outcome == 'success'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        REVIEW_START_TIME: ${{ env.REVIEW_START_TIME }}
        SEVERITY_REGEX_SH: ${{ github.action_path }}/lib/severity-regex.sh
      run: |
        set -euo pipefail
        # shellcheck source=lib/severity-regex.sh
        # shellcheck disable=SC1090
        source "$SEVERITY_REGEX_SH"
        REPO="$GH_REPOSITORY"

        # Select the bot comment posted/updated during this review run.
        #
        # Selector relies on `cancel-in-progress: true` concurrency at the workflow
        # level (claude-pr-review.yml ~line 50–52). If a future edit weakens that
        # concurrency block, the prior-run-overlap race S3 from the Phase 0 spike
        # (https://github.com/glitchwerks/github-actions/pull/246#issuecomment-4409961575)
        # re-opens and this selector can pick the wrong comment.
        #
        # track_progress: true updates the sticky comment in-place, so created_at
        # may predate REVIEW_START_TIME; filter on updated_at instead.
        # In practice each new run produces a separate sticky comment (multiple bot
        # comments accumulate on a PR with multiple pushes — see action.yml line 254).
        COMMENT_JSON=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
          --jq "map(select((.user.login | endswith(\"[bot]\")) and .updated_at >= \"$REVIEW_START_TIME\")) | sort_by(.updated_at) | last // empty" \
          2>/dev/null || echo "")

        if [ -z "$COMMENT_JSON" ]; then
          echo "No bot comment updated during this review — skipping marker synthesis"
          exit 0
        fi

        BODY=$(printf '%s' "$COMMENT_JSON" | jq -r '.body // ""')
        COMMENT_ID=$(printf '%s' "$COMMENT_JSON" | jq -r '.id')

        # Pin comment ID for the shadow gate step to avoid replication-lag race.
        # The shadow gate reads from the same comment W3 just PATCHed, rather than
        # re-selecting independently and potentially hitting stale API state.
        echo "SYNTHESIS_COMMENT_ID=$COMMENT_ID" >> "$GITHUB_ENV"

        # Skip if the LLM already emitted the marker correctly.
        if printf '%s' "$BODY" | grep -qF '<!-- claude-pr-review-summary-v1'; then
          echo "Marker already present in review body — no synthesis needed"
          exit 0
        fi

        # Count per-bucket using grep -oE | wc -l (counts matches, not lines).
        # grep -cE would count lines; a single line containing two severity tokens
        # would count as 1 — grep -oE | wc -l counts each token individually.
        # Pre-filter drops resolution-narration lines so resolved findings on
        # incremental reviews don't inflate the synthesized counts (issue #248).
        # Expanded in #257: also drop lines ending in **FIXED**, **ADDRESSED**,
        # or **RESOLVED** (bold markdown) — the persona's terminal suffix on
        # two-level narration structures where the ✅ appears on a section header
        # rather than on the same line as the severity token. Pattern anchored to
        # end-of-line (\s*$) to avoid false-positive suppression of findings that
        # mention FIXED/ADDRESSED/RESOLVED bold mid-line (#258 review feedback).
        # Same pre-filter applies in the authoritative and shadow gate steps;
        # all three callsites must stay in sync.
        OPEN_BODY=$(printf '%s' "$BODY" | grep -vE '✅|\*\*(FIXED|ADDRESSED|RESOLVED)\*\*\s*$' || true)
        CRITICAL=$(printf '%s' "$OPEN_BODY" | grep -oE "$SEVERITY_CRITICAL_RE" | wc -l || true)
        HIGH=$(printf '%s' "$OPEN_BODY"     | grep -oE "$SEVERITY_HIGH_RE"     | wc -l || true)
        MEDIUM=$(printf '%s' "$OPEN_BODY"   | grep -oE "$SEVERITY_MEDIUM_RE"   | wc -l || true)
        LOW=$(printf '%s' "$OPEN_BODY"      | grep -oE "$SEVERITY_LOW_RE"      | wc -l || true)

        # Defensive synthesis: refuse to post 0/0/0/0 unless a corroboration signal
        # confirms the LLM performed substantive analysis.
        # A 0/0/0/0 marker on a trivial (zero-diff) PR is legitimate.
        # A 0/0/0/0 marker on a non-trivial PR with no persona structure is suspect:
        # the persona may have dropped severity tagging entirely, which would make
        # the shadow gate post agree:clean on what is actually a persona dropout.
        if [ "$CRITICAL" -eq 0 ] && [ "$HIGH" -eq 0 ] && [ "$MEDIUM" -eq 0 ] && [ "$LOW" -eq 0 ]; then
          BODY_LEN=$(printf '%s' "$BODY" | wc -c)
          HAS_SECTION=$(printf '%s' "$BODY" | grep -cE '^### (Findings|Verdict)' || true)
          # Accept 0/0/0/0 if: body is substantive (>500 chars) OR has persona section headers.
          # Reject (post error) if body is short AND has no section headers — likely persona dropout.
          # NOTE: body-length is the primary independent corroborator; section headers are secondary.
          # Do not tighten the section-header check thinking it is load-bearing — it is not.
          if [ "$BODY_LEN" -lt 500 ] && [ "$HAS_SECTION" -eq 0 ]; then
            echo "synthesis_skipped:no_corroboration — zero counts but no persona structure detected"
            gh api "repos/$REPO/statuses/$HEAD_SHA" \
              -X POST \
              -f state=error \
              -f description='synthesis_skipped:no_corroboration' \
              -f context='claude-pr-review/quality-gate-shadow' \
              -f target_url="$GITHUB_SERVER_URL/$REPO/pull/$PR_NUMBER" 2>/dev/null || true
            exit 0
          fi
        fi

        MARKER=$(printf '<!-- claude-pr-review-summary-v1\n{"schemaVersion":1,"findings":{"critical":%d,"high":%d,"medium":%d,"low":%d}}\n-->' \
          "$CRITICAL" "$HIGH" "$MEDIUM" "$LOW")

        NEW_BODY=$(printf '%s\n\n%s' "$BODY" "$MARKER")

        gh api "repos/$REPO/issues/comments/$COMMENT_ID" \
          -X PATCH \
          -f body="$NEW_BODY"
        echo "Marker synthesized and appended: critical=$CRITICAL high=$HIGH medium=$MEDIUM low=$LOW"

    - name: Quality gate — structured marker (advisory shadow)
      if: steps.authz.outputs.skip != 'true' && steps.size-check.outputs.skip != 'true' && steps.claude-review.outcome == 'success'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Path to the sourceable marker parser — resolved relative to the action's
        # directory at runtime. The $GITHUB_ACTION_PATH variable is set by the
        # Actions runner to the directory containing this action.yml file.
        PARSE_MARKER_SH: ${{ github.action_path }}/lib/parse-marker.sh
        SEVERITY_REGEX_SH: ${{ github.action_path }}/lib/severity-regex.sh
        # SYNTHESIS_COMMENT_ID is written to $GITHUB_ENV by the synthesis step above
        # when it successfully selects and patches a comment. When set, this step
        # fetches that specific comment ID directly to avoid re-selecting and
        # potentially hitting API replication lag on the just-patched body.
        # shellcheck disable=SC2016
        SYNTHESIS_COMMENT_ID: ${{ env.SYNTHESIS_COMMENT_ID }}
        REVIEW_START_TIME: ${{ env.REVIEW_START_TIME }}
      run: |
        set -euo pipefail
        REPO="$GH_REPOSITORY"
        # shellcheck source=lib/severity-regex.sh
        # shellcheck disable=SC1090
        source "$SEVERITY_REGEX_SH"

        # --- Fetch the review comment body. ------------------------------------------
        # If the synthesis step pinned a comment ID to $GITHUB_ENV, use it directly
        # (avoids replication-lag race on the just-PATCHed body). Otherwise fall back
        # to the sort_by(updated_at)|last selector, gated by REVIEW_START_TIME so a
        # foreign bot's stale comment can't win the sort under endswith("[bot]")
        # (#250) — mirrors the authoritative gate's selector.
        if [ -n "${SYNTHESIS_COMMENT_ID:-}" ]; then
          BODY=$(gh api "repos/$REPO/issues/comments/$SYNTHESIS_COMMENT_ID" \
            --jq '.body // ""' 2>/dev/null || echo "")
          echo "Shadow gate: fetching pinned comment id=$SYNTHESIS_COMMENT_ID"
        else
          # IMPORTANT (#184 fix): sort_by(.updated_at) | last picks the most-recently-
          # edited bot comment; the API returns created_at ASC by default and does not
          # honour sort/direction params.
          BODY=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
            --jq "map(select((.user.login | endswith(\"[bot]\")) and .updated_at >= \"$REVIEW_START_TIME\")) | sort_by(.updated_at) | last | .body // \"\"" \
            2>/dev/null || echo "")
        fi

        # Skip entirely when there is no bot comment (review did not complete).
        if [ -z "$BODY" ]; then
          echo "Shadow gate: no [bot] sticky comment found — skipping"
          exit 0
        fi

        # --- Prose-regex result (sourced from lib/severity-regex.sh) ----------------
        # Regex sourced above; $SEVERITY_BLOCKER_RE is the combined blocker class.
        # Pre-filter drops resolution-narration lines so resolved findings
        # on incremental reviews don't inflate the prose hit count. Expanded
        # in #257 to also cover **FIXED**/**ADDRESSED**/**RESOLVED** suffixes
        # (bold markdown). Anchored to end-of-line (\s*$) so only the persona's
        # terminal suffix is suppressed, not mid-line occurrences (#258). Must stay
        # in sync with the authoritative gate step and the synthesis pre-filter
        # (#248, #257, #258).
        BLOCKER_HITS=$(printf '%s' "$BODY" | grep -vE '✅|\*\*(FIXED|ADDRESSED|RESOLVED)\*\*\s*$' | grep -E -c "$SEVERITY_BLOCKER_RE" || true)
        if [ "$BLOCKER_HITS" -gt "0" ]; then
          PROSE_RESULT="blocking"
        else
          PROSE_RESULT="clean"
        fi
        echo "Shadow gate — prose-regex result: $PROSE_RESULT ($BLOCKER_HITS hit(s))"

        # --- Marker-based result ----------------------------------------------------
        # Source the parse-marker helper; function parse_marker is now available.
        # shellcheck disable=SC1090
        source "$PARSE_MARKER_SH"

        MARKER_OUTPUT=$(printf '%s' "$BODY" | parse_marker)
        MARKER_OUTCOME=$(printf '%s' "$MARKER_OUTPUT" | cut -d'|' -f1)
        echo "Shadow gate — marker parser output: $MARKER_OUTPUT"

        # --- Compute status state and description -----------------------------------
        case "$MARKER_OUTCOME" in
          marker_missing)
            SHADOW_STATE="error"
            SHADOW_DESC="marker_missing"
            AGREE_LABEL="marker_missing"
            ;;
          marker_invalid)
            SHADOW_STATE="error"
            SHADOW_DESC="marker_invalid"
            AGREE_LABEL="marker_invalid"
            ;;
          clean)
            SHADOW_STATE="success"
            if [ "$PROSE_RESULT" = "clean" ]; then
              AGREE_LABEL="agree:clean"
            else
              AGREE_LABEL="disagree:prose=blocking/marker=clean"
            fi
            SHADOW_DESC="$AGREE_LABEL"
            ;;
          blocking)
            SHADOW_STATE="failure"
            if [ "$PROSE_RESULT" = "blocking" ]; then
              AGREE_LABEL="agree:blocking"
            else
              AGREE_LABEL="disagree:prose=clean/marker=blocking"
            fi
            SHADOW_DESC="$AGREE_LABEL"
            ;;
          *)
            SHADOW_STATE="error"
            SHADOW_DESC="marker_invalid: unexpected outcome token"
            AGREE_LABEL="marker_invalid"
            ;;
        esac

        # --- Post advisory commit status -------------------------------------------
        # CRITICAL: this status is ADVISORY ONLY. It must NOT be added to branch
        # protection. The authoritative gate is claude-pr-review/quality-gate.
        gh api "repos/$REPO/statuses/$HEAD_SHA" \
          -f state="$SHADOW_STATE" \
          -f context="claude-pr-review/quality-gate-shadow" \
          -f description="$SHADOW_DESC"
        echo "Posted status: context=claude-pr-review/quality-gate-shadow state=$SHADOW_STATE desc=$SHADOW_DESC"

        # --- Step summary -----------------------------------------------------------
        {
          echo "## Quality-gate shadow summary"
          echo ""
          echo "| Signal | Result |"
          echo "|--------|--------|"
          printf '| Prose-regex | `%s` (%d hit(s)) |\n' "$PROSE_RESULT" "$BLOCKER_HITS"
          printf '| Structured marker | `%s` |\n' "$MARKER_OUTCOME"
          printf '| Agreement label | `%s` |\n' "$AGREE_LABEL"
          echo ""
          echo "> Shadow status \`claude-pr-review/quality-gate-shadow\` is **advisory only**."
          echo "> The authoritative gate is \`claude-pr-review/quality-gate\`."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Post incomplete-review warning
      if: failure() && steps.authz.outputs.skip != 'true' && steps.size-check.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        EFFECTIVE_MAX_TURNS: ${{ env.EFFECTIVE_MAX_TURNS }}
        FILES: ${{ env.PR_FILES }}
        REVIEW_START_TIME: ${{ env.REVIEW_START_TIME }}
      run: |
        # Skip the warning if Claude already posted a review comment during this run.
        # Claude posts its summary as a regular PR comment (via use_sticky_comment), not a
        # formal review submission, so we check comments rather than reviews.
        # Filter by author (any [bot]) and timestamp to avoid false positives
        # from human comments or comments posted by a prior run on the same PR.
        COMMENT_COUNT=$(gh pr view "$PR_NUMBER" --json comments \
          | jq --arg since "$REVIEW_START_TIME" \
          '[.comments[] | select(.author.login | endswith("[bot]")) | select(.createdAt > $since)] | length' \
          2>/dev/null || echo "0")

        if [ "$COMMENT_COUNT" -gt "0" ]; then
          echo "Claude posted a review comment during this run before hitting the turn limit — skipping incomplete-review warning"
          exit 0
        fi

        gh pr comment "$PR_NUMBER" --body "$(cat <<EOF
        ⚠️ **Automated PR review incomplete**

        Claude hit the turn limit before finishing this review. The PR may be too large or complex for the current settings.

        **What happened:** The review was cut off at $EFFECTIVE_MAX_TURNS turns (PR has $FILES files changed).

        **Options:**
        - Re-run the workflow with a higher \`max_turns\` input
        - Break the PR into smaller, focused pieces
        - Trigger a manual review with \`@claude review this PR\`
        EOF
        )"
