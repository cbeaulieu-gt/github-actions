name: Verify App Secrets

# Manually-triggered diagnostic workflow that mints a GitHub App
# installation token to verify APP_ID and APP_PRIVATE_KEY org-level
# secrets resolve correctly. Does not call Claude or post comments.
# Safe to keep long-term as an ops diagnostic, or delete after the
# one-time verification is complete (refs #148).

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Mint App installation token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Confirm token minted
        env:
          TOKEN_PRESENT: ${{ steps.token.outputs.token != '' }}
        run: |
          if [ "$TOKEN_PRESENT" = "true" ]; then
            echo "::notice::App-token resolution succeeded — APP_ID and APP_PRIVATE_KEY org-level secrets resolved correctly. Token minted at $(date -u)."
          else
            echo "::error::App-token mint succeeded but token output is empty — unexpected state."
            exit 1
          fi

      - name: Identify App + scope (diagnostic for #144)
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.token.outputs.installation-id }}
        run: |
          set -euo pipefail
          echo "=== App identity (from create-github-app-token outputs) ==="
          echo "  app-slug:        ${APP_SLUG:-<empty>}"
          echo "  installation-id: ${INSTALLATION_ID:-<empty>}"
          echo "  install-settings: https://github.com/organizations/glitchwerks/settings/installations/${INSTALLATION_ID:-?}"
          echo "  app-settings:    https://github.com/organizations/glitchwerks/settings/apps/${APP_SLUG:-?}"
          echo
          echo "=== /installation/repositories (installation scope) ==="
          gh api /installation/repositories --jq '.repositories | map(.full_name) | sort | .[]' || true
          echo
          echo "=== Scopes on minted installation token (X-OAuth-Scopes equivalent) ==="
          # The token is an installation token, not an OAuth token, so X-OAuth-Scopes
          # isn't returned. Instead we probe a workflow-scoped endpoint: if the App
          # has 'workflows: write', PUT to a non-existent workflow file dry-runs as 422
          # (validation), not 403 (forbidden). 403 = no workflows permission.
          set +e
          probe=$(gh api -X GET /repos/glitchwerks/github-actions/contents/.github/workflows/probe-nonexistent-${RANDOM}.yml 2>&1)
          probe_rc=$?
          set -e
          # 404 on GET = file doesn't exist (expected, normal access). What we really
          # need is to attempt a write that GitHub would reject with a permission-
          # specific error. Easiest: the installation-token API surfaces .permissions:
          gh api /installation/repositories --jq '"installation token works on \(.total_count) repo(s)"'
          echo
          echo "=== Where to grant 'workflows: write' if missing ==="
          echo "  1. Visit https://github.com/organizations/glitchwerks/settings/apps/${APP_SLUG:-<slug>}/permissions"
          echo "  2. Under 'Repository permissions' → 'Workflows' → set to Read & Write"
          echo "  3. Save, then visit the installation page to accept the new permission scope"
