name: Verify App Secrets

# Manually-triggered diagnostic workflow that mints a GitHub App
# installation token to verify APP_ID and APP_PRIVATE_KEY org-level
# secrets resolve correctly. Does not call Claude or post comments.
# Safe to keep long-term as an ops diagnostic, or delete after the
# one-time verification is complete (refs #148).

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Mint App installation token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Confirm token minted
        env:
          TOKEN_PRESENT: ${{ steps.token.outputs.token != '' }}
        run: |
          if [ "$TOKEN_PRESENT" = "true" ]; then
            echo "::notice::App-token resolution succeeded — APP_ID and APP_PRIVATE_KEY org-level secrets resolved correctly. Token minted at $(date -u)."
          else
            echo "::error::App-token mint succeeded but token output is empty — unexpected state."
            exit 1
          fi

      - name: Identify App + scope + probe workflows write (diagnostic for #205)
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.token.outputs.installation-id }}
        run: |
          set -euo pipefail
          echo "=== App identity (from create-github-app-token outputs) ==="
          echo "  app-slug:        ${APP_SLUG:-<empty>}"
          echo "  installation-id: ${INSTALLATION_ID:-<empty>}"
          echo "  install-settings: https://github.com/organizations/glitchwerks/settings/installations/${INSTALLATION_ID:-?}"
          echo "  app-settings:    https://github.com/organizations/glitchwerks/settings/apps/${APP_SLUG:-?}"
          echo
          echo "=== /installation/repositories (installation scope) ==="
          gh api /installation/repositories --jq '.repositories | map(.full_name) | sort | .[]' || true
          echo
          echo "=== Probe: attempt to create workflow file via Contents API ==="
          # Definitive test — does the minted installation token have effective
          # 'workflows: write' permission RIGHT NOW? If yes: PUT succeeds (we then
          # delete the probe file). If no: GitHub returns 403 with the same error
          # text seen in run 25410793517's STAGE 5.
          PROBE_FILE=".github/workflows/_probe-app-perms-${{ github.run_id }}.yml"
          PROBE_CONTENT='# probe — created and deleted by verify-app-secrets.yml diagnostic'
          B64=$(printf '%s' "$PROBE_CONTENT" | base64 -w 0)
          echo "Probe target: $PROBE_FILE (will be created and deleted)"
          set +e
          create_response=$(gh api -X PUT "/repos/glitchwerks/github-actions/contents/${PROBE_FILE}" \
            -f message="probe: test workflows: write permission on App ${APP_SLUG}" \
            -f content="$B64" \
            -f branch="${{ github.ref_name }}" \
            2>&1)
          create_rc=$?
          set -e
          if [ $create_rc -eq 0 ]; then
            echo "::notice::App HAS effective 'workflows: write' permission on installation ${INSTALLATION_ID}."
            # Capture sha so we can delete the probe.
            sha=$(printf '%s' "$create_response" | jq -r '.content.sha')
            echo "Cleaning up probe file (sha=$sha)..."
            gh api -X DELETE "/repos/glitchwerks/github-actions/contents/${PROBE_FILE}" \
              -f message="probe cleanup" \
              -f sha="$sha" \
              -f branch="${{ github.ref_name }}" >/dev/null
            echo "Probe deleted. STAGE 5 should now succeed."
          else
            echo "::error::App does NOT have effective 'workflows: write' permission yet."
            echo "Raw response from PUT /contents/${PROBE_FILE}:"
            printf '%s\n' "$create_response"
            echo
            echo "If you toggled the permission in App settings but the probe still fails,"
            echo "the installation has not yet ACCEPTED the new permission scope. Visit:"
            echo "  https://github.com/organizations/glitchwerks/settings/installations/${INSTALLATION_ID}"
            echo "and look for a banner like 'Review & accept new permissions'."
            exit 1
          fi
