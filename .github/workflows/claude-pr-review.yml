name: Claude PR Review

on:
  # Fires directly in this repo for dogfood PR review.
  # pull_request_target runs in the base repo's context (with secrets) even for fork PRs,
  # which prevents auth rejection from claude-code-action. Safe here because no fork code
  # is checked out or executed — Claude only reads the diff via `gh pr diff`.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  # Called by external consumers via `uses: glitchwerks/github-actions/.github/workflows/claude-pr-review.yml@v2`.
  workflow_call:
    secrets:
      claude_code_oauth_token:
        required: true
      app_id:
        required: true
      app_private_key:
        required: true
    inputs:
      authorized_users:
        description: 'Comma-separated list of GitHub usernames that bypass the association check (useful when org membership is private). See #253.'
        type: string
        required: false
        default: ''
      max_turns:
        description: 'Maximum number of Claude turns'
        type: string
        required: false
        default: '30'
      model:
        description: 'Claude model to use'
        type: string
        required: false
        default: 'claude-sonnet-4-5'

# Required for the pull_request_target trigger in this repo.
# External consumers using workflow_call must declare pull-requests: write in their own caller workflow.
permissions:
  contents: read
  packages: read
  pull-requests: write
  statuses: write

jobs:
  review:
    # Skip while the PR is in draft. The pull_request_target event types include
    # ready_for_review so a single review fires when the user marks the PR ready.
    # Issue #174 — avoids redundant API spend + duplicate-finding noise during
    # iterative draft work (cf. PR #171 which accumulated 14 review runs as a draft).
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Phase 5 (#188): pin the review overlay image by SHA256 digest.
    # The composite action's bash steps and the embedded `claude-code-action@v1`
    # invocation all run inside this container. The image bakes in Claude CLI
    # at $PATH_TO_CLAUDE_CODE_EXECUTABLE plus the review-specific agent set
    # (different-eyes guarantee per spec §3.1, §10.2).
    # Digest source: STAGE 3 build run 25405636887 (post-#200 rebuild, 3bb6a22) — base image bakes safe.directory '*' (#199, #197).
    container: ghcr.io/glitchwerks/claude-runtime-review@sha256:3796f8e59c740b5cf826ef812edb1fa2620326b776a288519a65eb894f104c60
    concurrency:
      group: claude-pr-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: glitchwerks/github-actions/pr-review@v2
        with:
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          app_id: ${{ secrets.app_id || secrets.APP_ID }}
          app_private_key: ${{ secrets.app_private_key || secrets.APP_PRIVATE_KEY }}
          authorized_users: ${{ inputs.authorized_users || '' }}
          model: ${{ inputs.model || 'claude-sonnet-4-5' }}
          max_turns: ${{ inputs.max_turns || '30' }}
